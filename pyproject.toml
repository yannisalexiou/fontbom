[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fontbom"
dynamic = ["version"]
description = "Scan mobile app binaries and codebases for bundled fonts and report their license status."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ioannis Alexiou" }]
keywords = ["fonts", "license", "compliance", "sbom", "ios", "android", "ipa", "apk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Fonts",
  "Typing :: Typed",
]
dependencies = [
  "fonttools[woff]>=4.50",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
fontbom = "fontbom.cli:main"

[project.urls]
Homepage = "https://github.com/ioannisalexiou/fontbom"

[tool.hatch.version]
path = "src/fontbom/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fontbom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true
